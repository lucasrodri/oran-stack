apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: r4-simple-mon-cic
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  timeout: 5m
  wait: true
  prune: true
  path: ./r4-simple-mon-cic-arm64
  sourceRef:
    kind: GitRepository
    name: cic
  serviceAccountName: r4-simple-mon-cic-deployer
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: r4-simple-mon
      namespace: ricxapp
