---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cic
  namespace: flux-system
spec:
  interval: 1m
  timeout: 30s
  url: http://192.168.72.10:30302/nephio/cic.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cic-lab-smoke
  namespace: flux-system
spec:
  interval: 1m
  timeout: 1m
  wait: true
  prune: true
  path: ./cic-lab-smoke
  sourceRef:
    kind: GitRepository
    name: cic
  serviceAccountName: nephio-deployer
