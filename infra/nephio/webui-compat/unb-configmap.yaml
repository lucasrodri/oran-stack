apiVersion: v1
kind: ConfigMap
metadata:
  name: nephio-webui-unb-config
  namespace: nephio-webui
data:
  app-config.nephio.yaml: |
    app:
      title: Nephio
      baseUrl: http://192.168.71.30:30707

    backend:
      baseUrl: http://192.168.71.30:30707
      listen:
        port: 7007
      csp:
        img-src: ["'self'", 'data:']
        upgrade-insecure-requests: false

    auth:
      providers:
        google:
          development:
            clientId: ${AUTH_GOOGLE_CLIENT_ID}
            clientSecret: ${AUTH_GOOGLE_CLIENT_SECRET}
        okta:
          development:
            clientId: ${AUTH_OKTA_CLIENT_ID}
            clientSecret: ${AUTH_OKTA_CLIENT_SECRET}
            audience: ${AUTH_OKTA_AUDIENCE}
            authServerId: ${AUTH_OKTA_AUTH_SERVER_ID}
            idp: ${AUTH_OKTA_IDP}

    configAsData:
      resourcesNamespace: default
      gitOpsDeliveryTool: none
      clusterLocatorMethod:
        authProvider: ${AUTH_PROVIDER}
        oidcTokenProvider: ${AUTH_OIDC_TOKEN_PROVIDER}
        serviceAccountToken: ${AUTH_SERVICE_ACCOUNT_TOKEN}
      branding:
        title: Nephio
        header:
          logoUrl: data:image/png;base64,
          backgroundImageUrl: data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=
