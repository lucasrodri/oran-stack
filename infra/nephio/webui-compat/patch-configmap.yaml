apiVersion: v1
kind: ConfigMap
metadata:
  name: nephio-webui-package-parser-patch
  namespace: nephio-webui
data:
  patch-webui.js: |
    const fs = require('fs');
    const path = require('path');

    const staticDirectory = '/patched-static';
    const chunks = fs.readdirSync(staticDirectory)
      .filter(name => /^3706\..+\.chunk\.js$/.test(name));

    if (chunks.length !== 1) {
      throw new Error(`expected one CAD chunk, found ${chunks.length}`);
    }

    const chunkPath = path.join(staticDirectory, chunks[0]);
    const original = fs.readFileSync(chunkPath, 'utf8');
    const needle = 'return d?[{id:`${d.kind}:';
    const replacement = 'return d&&d.metadata?[{id:`${d.kind}:';
    const occurrences = original.split(needle).length - 1;
    const logoSizeNeedle = 'maxHeight:"45px"';
    const logoSizeReplacement = 'maxHeight:"80px"';
    const logoSizeOccurrences = original.split(logoSizeNeedle).length - 1;

    if (occurrences !== 1) {
      throw new Error(`expected one package parser match, found ${occurrences}`);
    }
    if (logoSizeOccurrences !== 1) {
      throw new Error(`expected one logo size match, found ${logoSizeOccurrences}`);
    }

    const patched = original
      .replace(needle, replacement)
      .replace(logoSizeNeedle, logoSizeReplacement);
    fs.writeFileSync(chunkPath, patched);
    console.log(`patched ${chunks[0]} for KRM parsing and the UnB logo size`);
