apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kpm-anomaly-prb
  namespace: flux-system
spec:
  interval: 1m
  timeout: 5m
  retryInterval: 20s
  wait: true
  prune: true
  path: ./kpm-anomaly-prb-nmi
  sourceRef:
    kind: GitRepository
    name: nmi
  serviceAccountName: kpm-anomaly-prb-deployer
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kpm-anomaly-prb
      namespace: ricxapp
