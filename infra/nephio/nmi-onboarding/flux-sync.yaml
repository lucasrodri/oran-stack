---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: nmi
  namespace: flux-system
spec:
  interval: 1m
  timeout: 30s
  url: http://gitea.gitea.svc.cluster.local:3000/nephio/nmi.git
  ref:
    branch: main
  secretRef:
    name: nmi-access-token-flux
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nmi-lab-smoke
  namespace: flux-system
spec:
  interval: 1m
  timeout: 1m
  wait: true
  prune: true
  path: ./nmi-lab-smoke
  sourceRef:
    kind: GitRepository
    name: nmi
  serviceAccountName: nephio-deployer
