[defaults]
roles_path         = roles
collections_path   = ~/.ansible/collections

# No default inventory — specify on the command line:
#   -i inventories/hosts.ini       (bring-your-own machines)
#   -i inventories/gcp.ini         (GCP, generated by gcp-vm-create.yml)

verbosity          = 0
retry_files_enabled = false
# Supply Vault credentials explicitly only to playbooks that need them, using
# --ask-vault-pass or --vault-password-file. Provisioning and syntax checks do
# not consume Docker Hub secrets.
host_key_checking  = False

[ssh_connection]
pipelining = true
