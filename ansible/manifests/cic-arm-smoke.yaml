apiVersion: v1
kind: Namespace
metadata:
  name: lab-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arm64-web
  namespace: lab-smoke
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arm64-web
  template:
    metadata:
      labels:
        app: arm64-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: cic-k8s-w01
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: arm64-web
  namespace: lab-smoke
spec:
  selector:
    app: arm64-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: e2-smoke-cp
  namespace: lab-smoke
spec:
  config: '{"cniVersion":"0.3.1","type":"ovs","bridge":"e2br","ipam":{"type":"static","addresses":[{"address":"10.200.3.250/24"}]}}'
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: e2-smoke-worker
  namespace: lab-smoke
spec:
  config: '{"cniVersion":"0.3.1","type":"ovs","bridge":"e2br","ipam":{"type":"static","addresses":[{"address":"10.200.3.251/24"}]}}'
---
apiVersion: v1
kind: Pod
metadata:
  name: e2-smoke-cp
  namespace: lab-smoke
  annotations:
    k8s.v1.cni.cncf.io/networks: e2-smoke-cp
spec:
  nodeSelector:
    kubernetes.io/hostname: cic-k8s-cp01
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: probe
      image: alpine:3.20
      command: ["sleep", "86400"]
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: e2-smoke-worker
  namespace: lab-smoke
  annotations:
    k8s.v1.cni.cncf.io/networks: e2-smoke-worker
spec:
  nodeSelector:
    kubernetes.io/hostname: cic-k8s-w01
  containers:
    - name: probe
      image: alpine:3.20
      command: ["sleep", "86400"]
  restartPolicy: Never
