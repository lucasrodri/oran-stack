# Verify the current data-plane state instead of relying on startup log lines,
# which can rotate quickly when the PHY log level is verbose.

- name: Wait for UE PDU interface and Internet egress
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl --kubeconfig={{ _kubeconfig }} exec -n {{ namespaces.ran }} \
      deployment/srsue -c srsue -- sh -ec '
        ip -4 -o addr show dev tun_srsue | grep -Eq "inet 10\.45\."
        curl --interface tun_srsue -fsS --max-time 10 -o /dev/null http://example.com
        echo UE_EGRESS_OK
      '
  args:
    executable: /bin/bash
  register: _ue_probe
  until: _ue_probe.rc == 0 and 'UE_EGRESS_OK' in (_ue_probe.stdout | default(''))
  retries: "{{ verify_stack.ue_attach_wait_retries }}"
  delay: "{{ verify_stack.ue_attach_wait_delay }}"
  changed_when: false
  failed_when: false

- name: Set UE attach fact
  ansible.builtin.set_fact:
    _ue_attached: >-
      {{ _ue_probe.rc == 0 and
         'UE_EGRESS_OK' in (_ue_probe.stdout | default('')) }}

- name: Collect UE diagnostics when attach did not complete
  when: not (_ue_attached | bool)
  block:
    - name: Dump DU log tail
      ansible.builtin.command:
        cmd: >
          kubectl --kubeconfig={{ _kubeconfig }} logs -n {{ namespaces.ran }}
          deploy/ocudu-du --tail=30
      register: _du_log
      changed_when: false
      failed_when: false

    - name: Fail with actionable UE diagnostics
      ansible.builtin.fail:
        msg: |-
          UE did NOT complete attach within
          {{ verify_stack.ue_attach_wait_retries | int * verify_stack.ue_attach_wait_delay | int }}s.

          UE probe output:
          {{ _ue_probe.stdout | default('') }}
          {{ _ue_probe.stderr | default('') }}

          DU log tail:
          {{ _du_log.stdout | default('') }}

          If the UE is stuck at 'Switching on' with no PRACH in the DU, verify
          the UE dl_arfcn matches the DU (helm/ran/values.yaml radio.dlArfcn)
          and that MongoDB has the subscriber (deploy_5g_core mongodb_init).
      when: verify_stack.ue_attach_required | bool

    - name: Warn (non-fatal) that UE attach is unconfirmed
      ansible.builtin.debug:
        msg: >-
          WARNING: UE attach unconfirmed. Check
          'kubectl logs -n {{ namespaces.ran }} deployment/srsue -f'.
      when: not (verify_stack.ue_attach_required | bool)

- name: Show UE data-plane result
  ansible.builtin.debug:
    msg: "UE OK — PDU interface 10.45.0.0/24 and Internet egress are functional"
  when: _ue_attached | bool
