# ============================================================================
# Role: deploy_xapp
# Purpose: Deploy the simple-mon KPM xApp onto the kubeadm cluster.
#   1. Create ricxapp namespace with privileged pod-security label
#   2. Create imagePullSecret
#   3. helm upgrade --install r4-simple-mon
#   4. Sync RTMgr/xApp RMR routes and verify that the full route-table model
#      retains the xApp subscription; wait for a real KPM indication
#   5. Wait for the xApp Deployment to be Available
# Do not restart E2Term after the xApp subscribes — that drops SCTP and the
# CU will not re-setup, leaving the gNB DISCONNECTED.
# ============================================================================
---

- name: Set kubeconfig fact
  ansible.builtin.set_fact:
    _kubeconfig: "{{ playbook_dir }}/../../kubeconfig"

- name: Discover the currently connected E2 node
  ansible.builtin.command:
    cmd: >
      kubectl --kubeconfig={{ _kubeconfig }} exec -n {{ namespaces.ric }}
      deployment/ric-e2mgr -c e2mgr --
      curl -fsS http://127.0.0.1:3800/v1/nodeb/states
  register: _e2_node_states
  until: >-
    (_e2_node_states.stdout | default('[]') | from_json |
     selectattr('connectionStatus', 'equalto', 'CONNECTED') | list | length) > 0
  retries: "{{ verify_stack.e2_gnb_wait_retries }}"
  delay: "{{ verify_stack.e2_gnb_wait_delay }}"
  changed_when: false

- name: Build the connected E2 node candidate lists
  ansible.builtin.set_fact:
    _xapp_connected_e2_nodes: >-
      {{ _e2_node_states.stdout | from_json |
         selectattr('connectionStatus', 'equalto', 'CONNECTED') |
         map(attribute='inventoryName') | list }}
    _xapp_connected_du_nodes: >-
      {{ _e2_node_states.stdout | from_json |
         selectattr('connectionStatus', 'equalto', 'CONNECTED') |
         selectattr('inventoryName', 'match', '^gnbd_') |
         map(attribute='inventoryName') | list }}

- name: Select the connected O-DU for the KPM subscription
  ansible.builtin.set_fact:
    _xapp_e2_node_id: >-
      {{ (_xapp_connected_du_nodes | length > 0) |
         ternary(_xapp_connected_du_nodes | first,
                 _xapp_connected_e2_nodes | first) }}

- name: Show selected E2 node
  ansible.builtin.debug:
    msg: "xApp will subscribe to connected E2 node {{ _xapp_e2_node_id }}"

# ----------------------------------------------------------------------------
# 1. Create ricxapp namespace
# ----------------------------------------------------------------------------
- name: Create ricxapp namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ _kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ namespaces.xapp }}"
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/warn:    privileged
          pod-security.kubernetes.io/audit:   privileged

# ----------------------------------------------------------------------------
# 2. Create Docker Hub imagePullSecret
# ----------------------------------------------------------------------------
- name: Create Docker Hub imagePullSecret in ricxapp namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ _kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name:      "{{ image_pull_secret_name }}"
        namespace: "{{ namespaces.xapp }}"
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {{ ({
            "auths": {
              "https://index.docker.io/v1/": {
                "username": dockerhub_username,
                "password": dockerhub_password,
                "auth": (dockerhub_username ~ ":" ~ dockerhub_password) | b64encode
              }
            }
          }) | to_json | b64encode }}
  no_log: true
  when: dockerhub_password | length > 0

# ----------------------------------------------------------------------------
# 3. Helm upgrade --install simple-mon xApp
# ----------------------------------------------------------------------------
- name: Load the patched xApp framework source
  ansible.builtin.set_fact:
    _xapp_base_source: >-
      {{ lookup('ansible.builtin.file',
                playbook_dir ~ '/../../xapps/python/lib/xAppBase.py') }}

- name: Publish patched xApp framework as a runtime override
  kubernetes.core.k8s:
    kubeconfig: "{{ _kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ xapp_runtime_override_configmap }}"
        namespace: "{{ namespaces.xapp }}"
      data:
        xAppBase.py: "{{ _xapp_base_source }}"

- name: Deploy simple-mon xApp Helm chart
  kubernetes.core.helm:
    kubeconfig: "{{ _kubeconfig }}"
    name:             "{{ helm_releases.xapp }}"
    chart_ref:        "{{ playbook_dir }}/../../{{ helm_charts.xapp }}"
    release_namespace: "{{ namespaces.xapp }}"
    create_namespace: false
    wait:             true
    wait_timeout:     "{{ helm_timeout }}"
    values_files:
      - "{{ playbook_dir }}/../../{{ helm_charts.xapp }}/values/simple-mon.yaml"
    values:
      imagePullSecrets: "{{ [{'name': image_pull_secret_name}] if (image_pull_secret_name | length > 0) else [] }}"
      image:
        repository: "{{ images.xapps.repository }}"
        tag:        "{{ images.xapps.tag }}"
      ric:
        namespace: "{{ namespaces.ric }}"
        submgrUri: "http://ric-submgr.{{ namespaces.ric }}:8088/ric/v1"
        appmgrRegisterUri: "http://ric-appmgr.{{ namespaces.ric }}:8080/ric/v1/register"
      xapp:
        e2NodeId: "{{ _xapp_e2_node_id }}"
      runtimeOverride:
        configMapName: "{{ xapp_runtime_override_configmap }}"
        checksum: "{{ _xapp_base_source | hash('sha256') }}"
  register: helm_xapp

- name: Show xApp Helm release status
  ansible.builtin.debug:
    msg: "xApp release status: {{ helm_xapp.status }}"

# ----------------------------------------------------------------------------
# 4. RTMgr only syncs xApps from AppMgr at startup. Resync routes after the
#    xApp registers, then restart the xApp so it subscribes against a stable
#    RMR routing table.
# ----------------------------------------------------------------------------
- name: Wait for xApp registration in AppMgr inventory
  ansible.builtin.shell: |
    set -euo pipefail
    APPMGR_IP=$(kubectl --kubeconfig={{ _kubeconfig }} get service ric-appmgr \
      -n {{ namespaces.ric }} -o jsonpath='{.spec.clusterIP}')
    APPS=$(curl -fsS "http://${APPMGR_IP}:8080/ric/v1/xapps")
    python3 -c '
    import json, sys
    apps = json.load(sys.stdin)
    ok = any(
        app.get("name") == "{{ helm_releases.xapp }}" and
        any("RIC_INDICATION" in (instance.get("rxMessages") or [])
            for instance in app.get("instances", []))
        for app in apps
    )
    raise SystemExit(0 if ok else 1)
    ' <<<"$APPS"
  args:
    executable: /bin/bash
  register: _xapp_appmgr_inventory
  until: _xapp_appmgr_inventory.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Restart RTMgr so it reloads xApps from AppMgr
  ansible.builtin.command:
    cmd: >
      kubectl --kubeconfig={{ _kubeconfig }} rollout restart
      deployment/ric-rtmgr -n {{ namespaces.ric }}
  changed_when: true

- name: Wait for RTMgr rollout after xApp registration
  ansible.builtin.command:
    cmd: >
      kubectl --kubeconfig={{ _kubeconfig }} rollout status
      deployment/ric-rtmgr -n {{ namespaces.ric }} --timeout=300s
  changed_when: false

- name: Wait for RTMgr to push platform routes to the xApp
  ansible.builtin.shell: |
    set -euo pipefail
    LOGS=$(kubectl --kubeconfig={{ _kubeconfig }} logs -n {{ namespaces.ric }} \
      deployment/ric-rtmgr -c rtmgr --since=10m)
    grep -Eq \
      'Update Routes to Endpoint: service-ricxapp-{{ helm_releases.xapp }}-rmr\.{{ namespaces.xapp }}:4561 successful' \
      <<<"$LOGS"
  args:
    executable: /bin/bash
  register: _rtmgr_route_push
  until: _rtmgr_route_push.rc == 0
  retries: 36
  delay: 5
  changed_when: false

- name: Delete the previous xApp subscription before process restart
  ansible.builtin.shell: |
    set -euo pipefail
    XLOG=$(kubectl --kubeconfig={{ _kubeconfig }} logs -n {{ namespaces.xapp }} \
      deployment/{{ helm_releases.xapp }} -c xapp --since=30m)
    REST_SUBID=$(sed -nE \
      's/.*Successfully subscribed with Subscription ID:[[:space:]]+([^[:space:]]+).*/\1/p' \
      <<<"$XLOG" | tail -1 || true)

    if [[ -n "${REST_SUBID:-}" ]]; then
      SUBMGR_IP=$(kubectl --kubeconfig={{ _kubeconfig }} get service ric-submgr \
        -n {{ namespaces.ric }} -o jsonpath='{.spec.clusterIP}')
      STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
        "http://${SUBMGR_IP}:8088/ric/v1/subscriptions/${REST_SUBID}")
      [[ "$STATUS" == "204" || "$STATUS" == "404" ]]
      sleep 3
    fi
  args:
    executable: /bin/bash
  changed_when: true

- name: Restart xApp so it subscribes only after RTMgr route sync
  ansible.builtin.command:
    cmd: >
      kubectl --kubeconfig={{ _kubeconfig }} rollout restart
      deployment/{{ helm_releases.xapp }} -n {{ namespaces.xapp }}
  changed_when: true

- name: Wait for xApp Deployment to be Available after route sync
  kubernetes.core.k8s_info:
    kubeconfig: "{{ _kubeconfig }}"
    kind: Deployment
    name:      "{{ helm_releases.xapp }}"
    namespace: "{{ namespaces.xapp }}"
    wait: true
    wait_condition:
      type:   Available
      status: "True"
    wait_timeout: "{{ verify_stack.xapp_deployment_wait_timeout }}"

- name: Wait for xApp AppMgr registration after route sync restart
  ansible.builtin.command:
    cmd: >
      kubectl --kubeconfig={{ _kubeconfig }} logs -n {{ namespaces.xapp }}
      deployment/{{ helm_releases.xapp }} -c xapp --since=10m
  register: _xapp_register_logs_after_restart
  until: >-
    'appmgr register' in (_xapp_register_logs_after_restart.stdout | default('')) and
    'HTTP 201' in (_xapp_register_logs_after_restart.stdout | default(''))
  retries: 30
  delay: 5
  changed_when: false

- name: Wait for xApp to subscribe after route sync restart
  ansible.builtin.command:
    cmd: >
      kubectl --kubeconfig={{ _kubeconfig }} logs -n {{ namespaces.xapp }}
      deployment/{{ helm_releases.xapp }} -c xapp --since=10m
  register: _xapp_subscribe_logs
  until: >-
    'Subscribe to E2 node ID' in (_xapp_subscribe_logs.stdout | default('')) and
    'Successfully subscribed' in (_xapp_subscribe_logs.stdout | default(''))
  retries: 30
  delay: 5
  changed_when: false

- name: Wait for RTMgr subscription route (12050) installed
  ansible.builtin.shell: |
    set -euo pipefail
    # Do NOT restart E2Term after this: that drops the SCTP association and
    # OCUDU CU does not re-setup E2, leaving the gNB DISCONNECTED and the
    # just-installed 12050 indication route orphaned.
    LOGS=$(kubectl --kubeconfig={{ _kubeconfig }} logs -n {{ namespaces.ric }} \
      deployment/ric-rtmgr -c rtmgr --since=10m)
    grep -Eq 'RoutingManager->SubManager Add Request Success' <<<"$LOGS"
    grep -Eq \
      'Update Routes to Endpoint: service-ricxapp-{{ helm_releases.xapp }}-rmr\.{{ namespaces.xapp }}:4561 successful.*Entries:[0-9]+' \
      <<<"$LOGS"
    grep -Eq \
      'Update Routes to Endpoint: ric-e2term:38000 successful.*Entries:[0-9]+' \
      <<<"$LOGS"
  args:
    executable: /bin/bash
  register: _rtmgr_sub_route_push
  until: _rtmgr_sub_route_push.rc == 0
  retries: 36
  delay: 5
  changed_when: false

- name: Extract E2EventInstanceId used by the RMR subscription route
  ansible.builtin.shell: |
    set -euo pipefail
    XLOG=$(kubectl --kubeconfig={{ _kubeconfig }} logs -n {{ namespaces.xapp }} \
      deployment/{{ helm_releases.xapp }} -c xapp --since=10m)
    SUBID=$(sed -nE 's/.*mapping: .* -> ([0-9]+).*/\1/p' <<<"$XLOG" | tail -1 || true)
    [[ -n "${SUBID:-}" && "$SUBID" != "0" ]]
    echo "$SUBID"
  args:
    executable: /bin/bash
  register: _subid_extract
  until: _subid_extract.rc == 0
  retries: 30
  delay: 2
  changed_when: false

- name: Verify full RTMgr policy retains the KPM indication route
  ansible.builtin.shell: |
    set -euo pipefail
    RTMGR_IP=$(kubectl --kubeconfig={{ _kubeconfig }} get service ric-rtmgr \
      -n {{ namespaces.ric }} -o jsonpath='{.spec.clusterIP}')
    curl -fsS "http://${RTMGR_IP}:3800/ric/v1/getdebuginfo" | \
      python3 -c '
    import json, sys
    route = (
        "mse|12050|{{ _subid_extract.stdout | trim }}|"
        "service-ricxapp-{{ helm_releases.xapp }}-rmr.{{ namespaces.xapp }}:4561\n"
    )
    debug = json.load(sys.stdin)
    raise SystemExit(0 if route in debug.get("RouteTable", []) else 1)
    '
  args:
    executable: /bin/bash
  register: _rtmgr_durable_kpm_route
  until: _rtmgr_durable_kpm_route.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Wait for real KPM indication in xApp logs
  ansible.builtin.command:
    cmd: >
      kubectl --kubeconfig={{ _kubeconfig }} logs -n {{ namespaces.xapp }}
      deployment/{{ helm_releases.xapp }} -c xapp --since=10m
  register: _xapp_indication_logs
  until: >-
    'RIC Indication Received' in (_xapp_indication_logs.stdout | default(''))
  retries: "{{ verify_stack.xapp_functional_wait_retries }}"
  delay: "{{ verify_stack.xapp_functional_wait_delay }}"
  changed_when: false
