# Add VM 113 to the existing NMI cluster as the worker reserved by placement
# for Nephio management workloads. Ubuntu and Debian workers can coexist; the
# Kubernetes minor/patch must match the v1.30.14 control plane.
# The SSH login is intentionally omitted. Ansible uses the current operator;
# pass `-u aluno` when the allocated laboratory account differs.

[control_plane]
oran-k8s-01 ansible_host=192.168.72.10 control_plane_ip=192.168.72.10

[nephio_workers]
nephio-k8s-w01 ansible_host=192.168.71.30

[workers:children]
nephio_workers

[k8s_cluster:children]
control_plane
workers

[k8s_cluster:vars]
ansible_python_interpreter=auto_silent
