# The SSH login is intentionally omitted. Ansible uses the current operator;
# pass `-u aluno` when the allocated laboratory account differs.

[control_plane]
oran-k8s-01 ansible_connection=local ansible_host=192.168.72.10 control_plane_ip=192.168.72.10 vxlan_suffix=cp01

[workers]
oran-k8s-w01 ansible_host=192.168.71.20 vxlan_suffix=w01
oran-k8s-w02 ansible_host=192.168.72.20 vxlan_suffix=w02

[k8s_cluster:children]
control_plane
workers

[k8s_cluster:vars]
ansible_python_interpreter=auto_silent

[local]
localhost ansible_connection=local ansible_python_interpreter={{ansible_playbook_python}} ran_cu_node=oran-k8s-01 ran_du_node=oran-k8s-01 ran_ue_node=oran-k8s-01 xapp_node=oran-k8s-w02 xapp_deployment_backend=nephio
