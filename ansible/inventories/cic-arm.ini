# Kubernetes ARM64 laboratory cluster at CIC.
#
# The VMs are hosted independently on Ampere 2 and Ampere 3 so the cluster
# exercises inter-host scheduling and networking.  Kubernetes 1.32 is pinned
# here (instead of changing the global default) because it is the newest minor
# validated by Nephio R6.
# The SSH login is intentionally omitted. Ansible uses the current operator;
# pass `-u aluno` when the allocated laboratory account differs.

[control_plane]
cic-k8s-cp01 ansible_host=192.168.0.210 control_plane_ip=192.168.0.210 vxlan_suffix=cp01 kubernetes_version=1.32 pod_cidr=10.246.0.0/16 service_cidr=10.97.0.0/16

[workers]
cic-k8s-w01 ansible_host=192.168.0.211 vxlan_suffix=w01 kubernetes_version=1.32 pod_cidr=10.246.0.0/16 service_cidr=10.97.0.0/16

[k8s_cluster:children]
control_plane
workers

[k8s_cluster:vars]
ansible_python_interpreter=auto_silent

[local]
localhost ansible_connection=local
