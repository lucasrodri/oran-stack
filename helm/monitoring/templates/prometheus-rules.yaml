apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: oran-lab-alerts
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: oran-stack
    release: {{ .Release.Name }}
spec:
  groups:
    - name: oran.availability
      rules:
        - alert: ORANNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
            component: kubernetes
          annotations:
            summary: "Kubernetes node {{ `{{ $labels.node }}` }} is not Ready"
            description: "The node has remained NotReady for more than five minutes."

        - alert: ORANPodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{namespace=~"5g-core|near-rt-ric|ricxapp|ran",reason="CrashLoopBackOff"}[5m]) >= 1
          for: 5m
          labels:
            severity: critical
            component: kubernetes
          annotations:
            summary: "{{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.pod }}` }} is crash-looping"
            description: "Container {{ `{{ $labels.container }}` }} has remained in CrashLoopBackOff."

        - alert: ORANE2TermUnavailable
          expr: kube_deployment_status_replicas_available{namespace="near-rt-ric",deployment="ric-e2term"} < 1
          for: 2m
          labels:
            severity: critical
            component: e2
          annotations:
            summary: "Near-RT RIC E2 termination is unavailable"
            description: "Without E2Term the CU/DU cannot maintain the E2/SCTP connection."

        - alert: ORANXAppUnavailable
          expr: kube_deployment_status_replicas_available{namespace="ricxapp",deployment="r4-simple-mon"} < 1
          for: 2m
          labels:
            severity: critical
            component: xapp
          annotations:
            summary: "The r4-simple-mon xApp is unavailable"
            description: "The KPM monitoring xApp has no available replica."

        - alert: ORANUeUnavailable
          expr: kube_deployment_status_replicas_available{namespace="ran",deployment="srsue"} < 1
          for: 2m
          labels:
            severity: warning
            component: ue
          annotations:
            summary: "The simulated UE is unavailable"
            description: "The srsUE deployment has no available replica."

    - name: oran.telemetry
      rules:
        - alert: ORANKPMTelemetryStale
          expr: absent(oran_xapp_kpm_indications_total) or increase(oran_xapp_kpm_indications_total[10m]) < 1
          for: 5m
          labels:
            severity: warning
            component: xapp
          annotations:
            summary: "No new E2SM-KPM indication has reached the xApp"
            description: "KPM telemetry has been absent or unchanged for at least ten minutes. Check E2 registration and the xApp subscription."

        - alert: ORANXAppRMRReceiveErrors
          expr: increase(oran_xapp_rmr_receive_errors_total[5m]) > 0
          labels:
            severity: warning
            component: xapp
          annotations:
            summary: "The xApp reported RMR receive errors"
            description: "RMR receive errors increased during the last five minutes."

        - alert: ORANMonitoringVolumeFilling
          expr: 100 * kubelet_volume_stats_used_bytes{namespace="monitoring"} / kubelet_volume_stats_capacity_bytes{namespace="monitoring"} > 85
          for: 15m
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "Monitoring PVC {{ `{{ $labels.persistentvolumeclaim }}` }} is filling"
            description: "Persistent volume usage has remained above 85% for fifteen minutes."

        - alert: ORANObservabilityDiskFilling
          expr: 100 * (1 - node_filesystem_avail_bytes{instance=~"164.41.240.13:.*",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{instance=~"164.41.240.13:.*",fstype!~"tmpfs|overlay"}) > 85
          for: 15m
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "Observability node filesystem is filling"
            description: "Filesystem {{ `{{ $labels.mountpoint }}` }} usage has remained above 85%."
