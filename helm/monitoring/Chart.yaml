apiVersion: v2
name: monitoring
description: >
  Prometheus + Grafana observability stack for the O-RAN lab.

  Deploys kube-prometheus-stack (Prometheus Operator + Grafana) and wires up
  ServiceMonitors for Kubernetes and the metrics endpoints exposed by the
  O-RAN workloads, including the simple-mon KPM xApp.

  Also ships a Grafana dashboard ConfigMap for O-RAN KPIs.
type: application
version: 0.2.4
appVersion: "O-RAN observability"

dependencies:
  - name: kube-prometheus-stack
    version: ">=58.0.0 <60.0.0"
    repository: https://prometheus-community.github.io/helm-charts
  - name: loki
    version: "7.3.0"
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled
  - name: alloy
    version: "1.12.1"
    repository: https://grafana.github.io/helm-charts
    condition: alloy.enabled
