apiVersion: v2
name: monitoring
description: >
  Prometheus + Grafana observability stack for the O-RAN lab.

  Deploys kube-prometheus-stack (Prometheus Operator + Grafana) and wires up
  ServiceMonitors for Kubernetes and the metrics endpoints exposed by the
  O-RAN workloads, including the simple-mon KPM xApp.

  Also ships a Grafana dashboard ConfigMap for O-RAN KPIs.
type: application
version: 0.1.3
appVersion: "kube-prometheus-stack-58.x"

dependencies:
  - name: kube-prometheus-stack
    version: ">=58.0.0 <60.0.0"
    repository: https://prometheus-community.github.io/helm-charts
