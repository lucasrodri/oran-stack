# ============================================================================
# monitoring Helm Chart — values.yaml
# ============================================================================
# This chart is a thin wrapper around kube-prometheus-stack.
# It pre-configures:
#   - Prometheus to discover ServiceMonitors in 5g-core and near-rt-ric
#   - Grafana with a pre-built O-RAN dashboard
#   - Retention and storage appropriate for a lab cluster
# ============================================================================

namespace: monitoring

# CIC ARM metrics are collected in the remote cluster and forwarded through
# the NMI control-plane VM, the only NMI node with a route to 192.168.0.0/24.
# HAProxy runs in TCP mode and does not retain request logs or metric data.
cicMonitoring:
  enabled: true
  controlPlane:
    address: 192.168.0.210
    nodeExporterPort: 9100
  worker:
    address: 192.168.0.211
    nodeExporterPort: 9100
    xappMetricsNodePort: 30691
  kubeStateMetricsNodePort: 30102
  relay:
    nodeName: oran-k8s-01
    image: haproxy:3.4.4-alpine

# ----------------------------------------------------------------------------
# kube-prometheus-stack sub-chart values
# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
# ----------------------------------------------------------------------------
kube-prometheus-stack:

  # --------------------------------------------------------------------------
  # Prometheus
  # --------------------------------------------------------------------------
  prometheus:
    prometheusSpec:
      # Keep the observability control plane on the dedicated physical node.
      nodeSelector:
        workload: observability
      tolerations:
        - key: workload
          operator: Equal
          value: observability
          effect: NoSchedule

      # Scrape interval — 15 s is enough for lab visibility.
      scrapeInterval: 15s
      evaluationInterval: 15s

      # Retain 7 days of metrics on the observability node.
      retention: 7d
      retentionSize: 16GB

      # Allow Prometheus to watch ServiceMonitors in ALL namespaces so we
      # can add monitors for 5g-core and near-rt-ric without modifying the
      # release namespace.
      serviceMonitorNamespaceSelector: {}
      serviceMonitorSelector: {}
      podMonitorNamespaceSelector: {}
      podMonitorSelector: {}
      ruleNamespaceSelector: {}

      additionalScrapeConfigs:
        - job_name: cic-node-exporter
          static_configs:
            - targets: ["cic-metrics-relay.monitoring.svc.cluster.local:19100"]
              labels:
                cluster: cic-arm
                site: cic
                node: cic-k8s-cp01
                architecture: arm64
            - targets: ["cic-metrics-relay.monitoring.svc.cluster.local:19101"]
              labels:
                cluster: cic-arm
                site: cic
                node: cic-k8s-w01
                architecture: arm64
        - job_name: cic-kube-state-metrics
          static_configs:
            - targets: ["cic-metrics-relay.monitoring.svc.cluster.local:19102"]
              labels:
                cluster: cic-arm
                site: cic
                architecture: arm64
        - job_name: cic-simple-mon
          metrics_path: /metrics
          static_configs:
            - targets: ["cic-metrics-relay.monitoring.svc.cluster.local:19103"]
              labels:
                cluster: cic-arm
                site: cic
                architecture: arm64
                xapp: r4-simple-mon-cic

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

      resources:
        requests:
          cpu: 50m
          memory: 512Mi

  # --------------------------------------------------------------------------
  # Grafana
  # --------------------------------------------------------------------------
  grafana:
    nodeSelector:
      workload: observability
    tolerations:
      - key: workload
        operator: Equal
        value: observability
        effect: NoSchedule

    # Default admin credentials — change in production.
    adminUser: admin
    adminPassword: oran-lab

    # Publish the lab dashboard on the Kubernetes nodes. The documented VPN
    # entry point is the control-plane private address; kube-proxy forwards it
    # to Grafana running on the physical observability worker.
    service:
      type: NodePort
      nodePort: 30300

    # Persist dashboards across pod restarts via ConfigMap sidecar.
    sidecar:
      dashboards:
        enabled: true
        # Watch for ConfigMaps with this label in any namespace.
        searchNamespace: ALL
        label: grafana_dashboard
        labelValue: "1"

    persistence:
      enabled: true
      type: sts
      storageClassName: local-path
      accessModes: ["ReadWriteOnce"]
      size: 5Gi

    additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://monitoring-loki-gateway.monitoring.svc.cluster.local
        isDefault: false
        jsonData:
          maxLines: 1000

    resources:
      requests:
        cpu: 100m
        memory: 256Mi

    grafana.ini:
      server:
        root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
      auth.anonymous:
        enabled: false

  # The operator and kube-state-metrics are part of the observability plane,
  # so they follow Prometheus/Grafana to the dedicated NMI server as well.
  prometheusOperator:
    nodeSelector:
      workload: observability
    tolerations:
      - key: workload
        operator: Equal
        value: observability
        effect: NoSchedule

  kube-state-metrics:
    nodeSelector:
      workload: observability
    tolerations:
      - key: workload
        operator: Equal
        value: observability
        effect: NoSchedule

  # --------------------------------------------------------------------------
  # Alertmanager — persistent lab UI. Notification integrations can be added
  # later without changing the alert rules.
  # --------------------------------------------------------------------------
  alertmanager:
    enabled: true
    service:
      type: NodePort
      nodePort: 30301
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ["alertname", "namespace", "severity"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        receiver: lab-ui
      receivers:
        - name: lab-ui
        # kube-prometheus-stack keeps its default Watchdog sub-route during
        # Helm value merging, so retain the conventional sink receiver too.
        - name: "null"
    alertmanagerSpec:
      nodeSelector:
        workload: observability
      tolerations:
        - key: workload
          operator: Equal
          value: observability
          effect: NoSchedule
      retention: 120h
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi

  # --------------------------------------------------------------------------
  # Node exporter — useful for seeing CPU/mem on Vagrant/GCP nodes
  # --------------------------------------------------------------------------
  nodeExporter:
    enabled: true

  # --------------------------------------------------------------------------
  # kube-state-metrics — tracks Deployment/Pod status
  # --------------------------------------------------------------------------
  kubeStateMetrics:
    enabled: true

  # --------------------------------------------------------------------------
  # Disable components not relevant to a 2-node lab cluster
  # --------------------------------------------------------------------------
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

# ----------------------------------------------------------------------------
# Loki — single binary, filesystem-backed log store for this lab.
# ----------------------------------------------------------------------------
loki:
  enabled: true
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 24h
      reject_old_samples: true
      reject_old_samples_max_age: 24h
      volume_enabled: true
    compactor:
      retention_enabled: true
      delete_request_store: filesystem

  singleBinary:
    replicas: 1
    nodeSelector:
      workload: observability
    tolerations:
      - key: workload
        operator: Equal
        value: observability
        effect: NoSchedule
    persistence:
      enabled: true
      storageClass: local-path
      size: 20Gi
      whenDeleted: Retain
      whenScaled: Retain
    resources:
      requests:
        cpu: 100m
        memory: 512Mi

  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  gateway:
    enabled: true
    nodeSelector:
      workload: observability
    tolerations:
      - key: workload
        operator: Equal
        value: observability
        effect: NoSchedule

# ----------------------------------------------------------------------------
# Alloy — one collector per node, tailing Kubernetes container logs to Loki.
# ----------------------------------------------------------------------------
alloy:
  enabled: true
  alloy:
    mounts:
      varlog: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
    configMap:
      content: |-
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            regex         = "5g-core|near-rt-ric|ricxapp|ran|monitoring"
            action        = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label  = "app"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "__path__"
            replacement   = "/var/log/pods/*$1/*.log"
          }
        }

        local.file_match "pod_logs" {
          path_targets = discovery.relabel.pod_logs.output
        }

        loki.process "pod_logs" {
          forward_to = [loki.write.cluster.receiver]
          stage.cri {}
          // These lines are high-frequency success telemetry already exported
          // as Prometheus metrics. Keep warnings/errors, but do not spend Loki
          // storage on one copy of every scrape and KPM report.
          stage.drop {
            expression = "GET /metrics|xAppBase: received RMR envelope|RIC Indication Received|E2SM_KPM RIC Indication Content|^-ColletStartTime|^-Measurements Data|^-granulPeriod|^--Metric|Sending E2 indication|Received RLC metrics"
          }
        }

        loki.source.file "pod_logs" {
          targets       = local.file_match.pod_logs.targets
          forward_to    = [loki.process.pod_logs.receiver]
          tail_from_end = true
        }

        loki.write "cluster" {
          endpoint {
            url = "http://monitoring-loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
          }
        }
  controller:
    type: daemonset
    tolerations:
      - operator: Exists
  serviceMonitor:
    enabled: true
