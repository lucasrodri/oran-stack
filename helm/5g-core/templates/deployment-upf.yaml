# ============================================================================
# UPF — User Plane Function
# ============================================================================
# The UPF remains privileged so it can create its ogstun TUN interface, but
# runs in the pod network.  Keeping PFCP and GTP-U on eth0 gives the UPF one
# stable, self-consistent identity: the same pod IP is advertised and used as
# the source of its UDP replies.  hostNetwork combined with a ClusterIP made
# Open5GS see two different PFCP peers (Service IP versus node IP).
{{- if .Values.nf.upf.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upf
  namespace: {{ .Values.namespace }}
  labels:
    app: upf
    app.kubernetes.io/part-of: oran-stack
spec:
  replicas: 1
  strategy:
    type: {{ .Values.deploymentStrategy }}
  selector:
    matchLabels:
      app: upf
  template:
    metadata:
      labels:
        app: upf
      annotations:
        checksum/nf-configs: {{ include (print $.Template.BasePath "/configmap-nf-configs.yaml") . | sha256sum }}
    spec:
      {{- include "5g-core.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: upf
          image: {{ .Values.images.core.repository }}:{{ .Values.images.core.tag }}
          imagePullPolicy: {{ .Values.images.core.pullPolicy }}
          command: ["/entrypoint.sh", "./install/bin/open5gs-upfd", "-c", "/open5gs/install/etc/open5gs/upf.yaml"]
          workingDir: /open5gs
          env:
            {{ include "5g-core.commonEnv" . | nindent 12 }}
          ports:
            - containerPort: 8805
              name: pfcp
              protocol: UDP
            - containerPort: 2152
              name: gtpu
              protocol: UDP
            - containerPort: 9090
              name: metrics
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - NET_RAW
          volumeMounts:
            {{ include "5g-core.nfVolumeMounts" . | nindent 12 }}
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
      volumes:
        {{ include "5g-core.nfVolumes" . | nindent 8 }}
---
# Headless Service for UPF. PFCP is stateful UDP signalling, so the SMF must
# contact the pod IP that the UPF itself uses in Association Setup responses.
apiVersion: v1
kind: Service
metadata:
  name: upf
  namespace: {{ .Values.namespace }}
  labels:
    app: upf
spec:
  clusterIP: None
  selector:
    app: upf
  ports:
    - name: pfcp
      port: 8805
      targetPort: 8805
      protocol: UDP
    - name: gtpu
      port: 2152
      targetPort: 2152
      protocol: UDP
    - name: metrics
      port: 9090
      targetPort: 9090
{{- end }}
