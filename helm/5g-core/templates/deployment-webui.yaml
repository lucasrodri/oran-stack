# ============================================================================
# WebUI — Open5GS Subscriber Management Interface
# ============================================================================
# Exposed as a LoadBalancer on port 9999 so operators can reach it from
# outside the cluster. The admin password is loaded from a Kubernetes Secret.
{{- if .Values.nf.webui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  namespace: {{ .Values.namespace }}
  labels:
    app: webui
    app.kubernetes.io/part-of: oran-stack
spec:
  replicas: 1
  strategy:
    type: {{ .Values.deploymentStrategy }}
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
    spec:
      {{- include "5g-core.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-mongodb
          image: {{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until mongosh --quiet "mongodb://mongodb:27017/admin?directConnection=true" \
                --eval 'const hello = db.hello(); if (!hello.isWritablePrimary) quit(1)'; do
                echo "Waiting for MongoDB writable primary..."; sleep 5;
              done
        - name: seed-webui-admin
          image: {{ .Values.images.webui.repository }}:{{ .Values.images.webui.tag }}
          imagePullPolicy: {{ .Values.images.webui.pullPolicy }}
          command:
            - node
            - -e
            - |
              const mongoose = require('mongoose');
              const Account = require('./server/models/account');
              (async () => {
                await mongoose.connect(process.env.DB_URI, {
                  useNewUrlParser: true,
                  useUnifiedTopology: true
                });
                let account = await Account.findOne({username: 'admin'});
                if (!account) account = new Account({username: 'admin'});
                account.roles = ['admin'];
                await account.setPassword(process.env.ADMIN_PASSWORD);
                await account.save();
                await mongoose.disconnect();
                console.log('WebUI administrator provisioned');
              })().catch(error => {
                console.error(error);
                process.exit(1);
              });
          env:
            - name: DB_URI
              value: {{ .Values.mongodb.uri | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.webui.adminSecretName }}
                  key: password
      containers:
        - name: webui
          image: {{ .Values.images.webui.repository }}:{{ .Values.images.webui.tag }}
          imagePullPolicy: {{ .Values.images.webui.pullPolicy }}
          env:
            - name: DB_URI
              value: {{ .Values.mongodb.uri | quote }}
            - name: MONGODB_URI
              value: {{ .Values.mongodb.uri | quote }}
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "9999"
          ports:
            - containerPort: 9999
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: {{ .Values.namespace }}
  labels:
    app: webui
spec:
  type: NodePort
  selector:
    app: webui
  ports:
    - name: http
      port: 9999
      targetPort: 9999
{{- end }}
