# ============================================================================
# ConfigMap: MongoDB replica-set initialization
# ============================================================================
# Subscriber and WebUI credentials deliberately do not live in this ConfigMap.
# Ansible provisions the subscriber from Vault after rs0 becomes PRIMARY, while
# the WebUI Deployment provisions its administrator from a Kubernetes Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init-scripts
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: oran-stack
data:
  init-rs.js: |
    try {
      rs.initiate({
        _id: 'rs0',
        members: [{
          _id: 0,
          host: 'mongodb-0.mongodb.{{ .Values.namespace }}.svc.cluster.local:27017',
          priority: 1
        }]
      });
      print('Replica set initialized successfully');
    } catch (e) {
      print('Replica set initialization message: ' + e.message);
    }
