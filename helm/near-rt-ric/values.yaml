# ============================================================================
# near-rt-ric Helm Chart — values.yaml
# ============================================================================

namespace: near-rt-ric

imagePullSecretName: ""

# RollingUpdate needs spare CPU for old+new pods on a single worker; Recreate
# avoids Pending pods when the worker is near its CPU request limit.
# Also required for Multus static IP on e2term.
deploymentStrategy: Recreate

# ----------------------------------------------------------------------------
# Secondary network (Multus/OVS) — static IP on the e2br OVS bridge.
# Used for SCTP E2AP traffic between e2term and the CU/DU.
# ----------------------------------------------------------------------------
secondaryNetworks:
  e2:
    nadName: "e2br-net"
    e2termIP: "10.200.3.4"

# ----------------------------------------------------------------------------
# RIC Component Images (O-RAN SC M release, rebuilt reproducibly for amd64)
# The Linux Foundation Nexus registry returns HTTP 402 from the NMI network.
# The workflow in .github/workflows/ric-m-images.yml therefore rebuilds the
# pinned upstream sources and publishes the resulting images to this fork's
# public GHCR namespace.
# ----------------------------------------------------------------------------
images:
  dbaas:
    # OSC dbaas ships Redis + SDL redismodule (MSETMPUB). Plain redis:6-alpine
    # lacks MSETMPUB, so e2mgr ChangeStatus(CONNECTED) fails with RNIB error and
    # never sends E2SetupResponse (12002).
    repository: ghcr.io/lucasrodri/oran-stack/ric-plt-dbaas
    tag: "0.6.5"
    pullPolicy: IfNotPresent
  e2term:
    repository: ghcr.io/lucasrodri/oran-stack/ric-plt-e2
    tag: "6.0.8"
    pullPolicy: IfNotPresent
  e2mgr:
    repository: ghcr.io/lucasrodri/oran-stack/ric-plt-e2mgr
    tag: "6.0.8"
    pullPolicy: IfNotPresent
  appmgr:
    repository: ghcr.io/lucasrodri/oran-stack/ric-plt-appmgr
    tag: "0.5.10"
    pullPolicy: IfNotPresent
  submgr:
    repository: ghcr.io/lucasrodri/oran-stack/ric-plt-submgr
    tag: "0.10.4"
    pullPolicy: IfNotPresent
  rtmgr:
    repository: ghcr.io/lucasrodri/oran-stack/ric-plt-rtmgr
    tag: "0.9.7"
    pullPolicy: IfNotPresent
  a1mediator:
    repository: ghcr.io/lucasrodri/oran-stack/ric-plt-a1
    tag: "3.2.3"
    pullPolicy: IfNotPresent

# Use the real Routing Manager now that its M-release image is available. The
# static HTTP stub remains as an explicit rollback/debug option.
rtmgr:
  enabled: true
  stubEnabled: false

# A1 is not required for the E2/KPM data path and remains opt-in until an A1
# policy client is part of the lab scenario. Its current image is available.
a1mediator:
  enabled: false

# ----------------------------------------------------------------------------
# RIC Identity (must match the DU's E2 setup request)
# ----------------------------------------------------------------------------
ric:
  id: "AACCE"
  mcc: "001"
  mnc: "01"

# ----------------------------------------------------------------------------
# Redis / DBAAS
# ----------------------------------------------------------------------------
dbaas:
  port: 6379

# ----------------------------------------------------------------------------
# e2term startup delay (seconds)
# The sleep before e2term starts prevents the RMR keep-alive race
# condition described in docs/LEARNINGS.md. Implemented as an initContainer.
e2termStartupDelaySec: 30

# e2mgr keep-alive / E2T deletion timers — relaxed for lab stability (see
# docs/E2_STABILIZATION_PLAN.md). Prevents e2mgr from deleting E2T before
# the CU completes E2 Setup.
e2mgr:
  keepAliveResponseTimeoutMs: 120000
  keepAliveDelayMs: 60000
  e2tInstanceDeletionTimeoutMs: 86400000
