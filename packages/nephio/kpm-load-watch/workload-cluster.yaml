apiVersion: infra.nephio.org/v1alpha1
kind: WorkloadCluster
metadata:
  name: workload-cluster
  annotations:
    config.kubernetes.io/local-config: "true"
    kpt.dev/config-injection: required
    oran.unb.br/site: nmi
    oran.unb.br/architecture: amd64
    oran.unb.br/xapp-node: oran-k8s-w02
    oran.unb.br/xapp-image: ghcr.io/lucasrodri/oran-stack/oran-xapps@sha256:3e9c671cd4cae63e41b4835a83a25fb1b2dc44420f534c5ee9904c0980699e55
    oran.unb.br/e2-node-id: gnbd_001_001_00019b_e2
    oran.unb.br/kpm-metric: DRB.UEThpDl
    oran.unb.br/kpm-report-period: "2000"
    oran.unb.br/load-window-size: "5"
    oran.unb.br/load-active-threshold-kbps: "1000"
    oran.unb.br/load-busy-threshold-kbps: "20000"
    # The xApp subscribes over REST and only receives RMR indications. Disabling
    # its private route collector avoids a second SO_REUSEPORT listener on 4561.
    oran.unb.br/rmr-flags: "1"
    oran.unb.br/e2mgr-uri: http://ric-e2mgr.near-rt-ric:3800/v1/nodeb/states
    oran.unb.br/xapp-name: kpm-load-watch
    oran.unb.br/xapp-ip: service-ricxapp-kpm-load-watch-rmr.ricxapp
    oran.unb.br/xapp-rmr-endpoint: service-ricxapp-kpm-load-watch-rmr.ricxapp:4561
    oran.unb.br/xapp-http-endpoint: service-ricxapp-kpm-load-watch-http.ricxapp:8091
    oran.unb.br/xapp-advertised-rmr-port: "4561"
    oran.unb.br/xapp-advertised-http-port: "8091"
    oran.unb.br/submgr-uri: http://ric-submgr.near-rt-ric:8088/ric/v1
    oran.unb.br/appmgr-register-uri: http://ric-appmgr.near-rt-ric:8080/ric/v1/register
spec:
  clusterName: nmi
  cnis:
    - flannel
    - multus
    - ovs-cni
