apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ricxapp
resources:
  - deployment.yaml
  - services.yaml
configMapGenerator:
  - name: r4-simple-mon-runtime
    files:
      - xAppBase.py
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: r4-simple-mon
    app.kubernetes.io/managed-by: Nephio
    nephio.org/site: nmi
