apiVersion: apps/v1
kind: Deployment
metadata:
  name: r4-simple-mon
  labels:
    app: r4-simple-mon
    release: r4-simple-mon
    app.kubernetes.io/name: r4-simple-mon
    app.kubernetes.io/managed-by: Nephio
    nephio.org/site: nmi
  annotations:
    nephio.org/package-revision: blueprint-v1
    nephio.org/demo-state: site-variant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: r4-simple-mon
      release: r4-simple-mon
  template:
    metadata:
      labels:
        app: r4-simple-mon
        release: r4-simple-mon
        app.kubernetes.io/name: r4-simple-mon
        app.kubernetes.io/managed-by: Nephio
        nephio.org/site: nmi
      annotations:
        checksum/runtime-override: 48ca48a2289e1badde94164c3e9d2029e82994c85bc9f8b8928666bb354d129b
        nephio.org/package-revision: blueprint-v1
        nephio.org/demo-state: site-variant
    spec:
      nodeSelector:
        kubernetes.io/hostname: oran-k8s-w02
      hostname: r4-simple-mon
      initContainers:
        - name: wait-for-gnb
          image: curlimages/curl@sha256:08e466006f0860e54fc299378de998935333e0e130a15f6f98482e9f8dab3058
          imagePullPolicy: IfNotPresent
          env:
            - name: E2_NODE_ID
              value: gnbd_001_001_00019b_e2
          command:
            - sh
            - -c
            - |
              E2MGR="http://ric-e2mgr.near-rt-ric:3800/v1/nodeb/states"
              GNB="${E2_NODE_ID}"
              echo "Waiting for connected gNB ${GNB} in e2mgr..."
              until curl -sf "${E2MGR}" | \
                sed 's/},{"inventoryName"/}\n{"inventoryName"/g' | \
                grep -F "\"inventoryName\":\"${GNB}\"" | \
                grep -Fq '"connectionStatus":"CONNECTED"'; do
                echo "gNB is absent or disconnected, retrying in 10s..."
                sleep 10
              done
              echo "gNB ${GNB} connected — starting xApp"
      containers:
        - name: xapp
          image: docker.io/x0tok/oran-xapps@sha256:752c9edc56b8644c78a1fc81d1106d0c34e02a55b48b58f880eaaf3240519a71
          imagePullPolicy: IfNotPresent
          command:
            - ./kpm_mon_xapp.py
          args:
            - --metrics=$(KPM_METRIC)
            - --kpm_report_style=1
            - --rmr_port=4561
            - --http_server_port=8091
            - --e2_node_id=$(E2_NODE_ID)
            - --ran_func_id=2
          ports:
            - name: rmr
              containerPort: 4561
              protocol: TCP
            - name: http
              containerPort: 8091
              protocol: TCP
          env:
            - name: E2_NODE_ID
              value: gnbd_001_001_00019b_e2
            - name: KPM_METRIC
              value: DRB.UEThpDl
            - name: RMR_RTG_SVC
              value: ""
            - name: XAPP_NAME
              value: r4-simple-mon
            - name: XAPP_NAMESPACE
              value: ricxapp
            - name: XAPP_IP
              value: service-ricxapp-r4-simple-mon-rmr.ricxapp
            - name: SUB_MGR_URI
              value: http://ric-submgr.near-rt-ric:8088/ric/v1
            - name: APP_MGR_REGISTER_URI
              value: http://ric-appmgr.near-rt-ric:8080/ric/v1/register
            - name: NEPHIO_PACKAGE_REVISION
              value: blueprint-v1
            - name: NEPHIO_DEMO_STATE
              value: site-variant
          volumeMounts:
            - name: runtime-override
              mountPath: /opt/xApps/lib/xAppBase.py
              subPath: xAppBase.py
              readOnly: true
      volumes:
        - name: runtime-override
          configMap:
            name: r4-simple-mon-runtime
