---
apiVersion: v1
kind: Service
metadata:
  name: r4-simple-mon-rmr-lab
  labels:
    app: r4-simple-mon
    app.kubernetes.io/name: r4-simple-mon
    app.kubernetes.io/managed-by: Nephio
    nephio.org/site: nmi
spec:
  type: NodePort
  selector:
    app: r4-simple-mon
    release: r4-simple-mon
  ports:
    - name: rmr
      protocol: TCP
      port: 4561
      targetPort: 4561
      nodePort: 30611
---
apiVersion: v1
kind: Service
metadata:
  name: r4-simple-mon-http-lab
  labels:
    app: r4-simple-mon
    app.kubernetes.io/name: r4-simple-mon
    app.kubernetes.io/managed-by: Nephio
    nephio.org/site: nmi
spec:
  type: NodePort
  selector:
    app: r4-simple-mon
    release: r4-simple-mon
  ports:
    - name: http
      protocol: TCP
      port: 8091
      targetPort: 8091
      nodePort: 30691
