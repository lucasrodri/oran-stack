name: Build multi-architecture laboratory xApps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'aluno/**'
      - 'student/**'
    paths:
      - .github/workflows/xapp-multiarch.yml
      - dockerfiles/xapp/**
      - xapps/python/**
      - xapps/templates/**
      - scripts/new-kpm-xapp.sh
      - tests/test_load_classifier.py

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  validate-student-scaffold:
    name: Validate student xApp scaffold
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Generate and validate a sample xApp
        shell: bash
        run: |
          set -euo pipefail
          scaffold_root="$(mktemp -d)"
          XAPP_SCAFFOLD_ROOT="${scaffold_root}" \
            ./scripts/new-kpm-xapp.sh kpm-ci-sample DRB.UEThpDl 2000
          python3 -m py_compile \
            "${scaffold_root}/xapps/python/kpm_ci_sample_xapp.py"
          python3 -m unittest tests/test_load_classifier.py
          grep -Fq 'exec ./kpm_ci_sample_xapp.py' \
            "${scaffold_root}/packages/nephio/kpm-ci-sample/deployment.yaml"
          grep -Fq 'package: kpm-ci-sample-nmi' \
            "${scaffold_root}/infra/nephio/blueprints/kpm-ci-sample-nmi-variant.yaml"
          test ! -e \
            "${scaffold_root}/packages/nephio/kpm-ci-sample/services-external.yaml"
          ! grep -Fq 'services-external.yaml' \
            "${scaffold_root}/packages/nephio/kpm-ci-sample/Kustomization"
          ! grep -RFq 'simple-mon' \
            "${scaffold_root}/packages/nephio/kpm-ci-sample" \
            "${scaffold_root}/infra/nephio/blueprints/kpm-ci-sample-nmi-variant.yaml"
          test "$(grep -RFl 'REPLACE_WITH_MULTIARCH_IMAGE_DIGEST' \
            "${scaffold_root}" | wc -l)" -eq 2

  build-runner:
    name: Build ARM64/AMD64 xApp runner
    needs: validate-student-scaffold
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/xapp/Dockerfile.runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/oran-xapp-runner:i-release-multiarch
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=i-release-multiarch
          cache-from: type=gha,scope=oran-xapp-runner
          cache-to: type=gha,mode=max,scope=oran-xapp-runner
          provenance: mode=max
          sbom: true

  build-xapps:
    name: Build ARM64/AMD64 laboratory xApps
    needs: build-runner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/xapp/Dockerfile.xapps
          build-args: |
            XAPP_RUNNER_IMAGE=${{ env.IMAGE_PREFIX }}/oran-xapp-runner:i-release-multiarch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/oran-xapps:i-release-multiarch
            ${{ env.IMAGE_PREFIX }}/oran-xapps:build-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=build-${{ github.sha }}
          cache-from: type=gha,scope=oran-xapps
          cache-to: type=gha,mode=max,scope=oran-xapps
          provenance: mode=max
          sbom: true

  verify-publication:
    name: Verify both image platforms
    needs: build-xapps
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Require AMD64 and ARM64 manifests
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_PREFIX}/oran-xapps:build-${GITHUB_SHA}"
          manifest=$(docker buildx imagetools inspect "${image}")
          grep -Fq 'Platform:    linux/amd64' <<<"${manifest}"
          grep -Fq 'Platform:    linux/arm64' <<<"${manifest}"
          printf 'Verified %s on linux/amd64 and linux/arm64\n' "${image}"
